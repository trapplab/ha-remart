[project]
name = "ha-remart"
version = "0.1.0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component",
  "samsungtvws[async,encrypted]==3.0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["custom_components"]
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant", "pytest_homeassistant_custom_component"]
